name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Guard dispatch branch is main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release workflow must be dispatched on main (current ref: ${{ github.ref }}) - aborting"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Prepare runtime configs
        run: |
          cp config.toml.example config.toml
          cp src/Awale/config.toml.example src/Awale/config.toml

      - name: Instantiate
        run: julia --project=. -e "using Pkg; Pkg.instantiate()"

      - name: Run tests (gate)
        run: julia --project=. -e "using Pkg; Pkg.test()"